<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>GymBro Analytics</title>
    <script>
      (() => {
        const storageKey = 'gymbro_analytics_language';
        const fallbackLanguage = 'en';
        const normalizeLanguage = (value) => {
          const normalized = String(value || fallbackLanguage).toLowerCase();
          if (normalized.startsWith('et')) return 'et';
          if (normalized.startsWith('ru')) return 'ru';
          return 'en';
        };
        const savedLanguage = (() => {
          try {
            return localStorage.getItem(storageKey);
          } catch {
            return null;
          }
        })();
        const browserLanguage = navigator.language || navigator.languages?.[0] || fallbackLanguage;
        const initialLanguage = normalizeLanguage(savedLanguage || browserLanguage || fallbackLanguage);

        document.documentElement.lang = initialLanguage;
      })();
    </script>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
